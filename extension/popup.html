<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      box-sizing: border-box;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #38bdf8;
    }
    .badge {
      font-size: 10px;
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      color: #eab308;
      border: 1px solid #334155;
    }
    label {
      font-size: 11px;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
    }
    input, textarea, select {
      width: 100%;
      background: #121722;
      border: 1px solid #1f293d;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 11px;
      color: #cbd5e1;
    }
    .checkbox-row input {
      width: auto;
      margin: 0;
    }
    button {
      width: 100%;
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    .status {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      display: none;
    }
    .status.success {
      color: #4ade80;
      display: block;
    }
  </style>
</head>
<body>
  <h2>
    hyFen8ed GPS
    <span class="badge">Capture</span>
  </h2>

  <label for="title">Title / Topic</label>
  <input type="text" id="title" placeholder="Loading page title...">

  <label for="url">URL (Reel, Video, or Article)</label>
  <input type="text" id="url" placeholder="Page URL">

  <label for="caption">Post Caption / Notes</label>
  <textarea id="caption" rows="2" placeholder="Optional notes or text from caption..."></textarea>

  <label for="pillar">Route to Life Pillar</label>
  <select id="pillar">
    <option value="knowledge">Knowledge Vault (General)</option>
    <option value="personal">Personal Life (Issues / Horizons / Skills)</option>
    <option value="health">Health & Vitality (Diet / Fitness / Care)</option>
    <option value="financial">Financial (Ventures / Money / Career)</option>
  </select>

  <div class="checkbox-row">
    <input type="checkbox" id="aiProcess" checked>
    <label for="aiProcess" style="margin:0; cursor:pointer;">AI Scan: Audio + Video OCR + Captions</label>
  </div>

  <button id="captureBtn">Send to GPS</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
